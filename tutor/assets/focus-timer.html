<!doctype html>
<html lang="no">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Fokustimer</title>
<style>
  :root {
    --bg: #ffffff; --fg: #1f2937; --muted: #6b7280; --card: #f3f4f6;
    --border: #d1d5db; --focus: #2563eb; --break: #15803d;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #111827; --fg: #e5e7eb; --muted: #9ca3af; --card: #1f2937;
      --border: #374151; --focus: #60a5fa; --break: #4ade80;
    }
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--fg);
         font: 16px/1.5 system-ui, -apple-system, sans-serif; }
  main { max-width: 420px; margin: 0 auto; padding: 32px 16px; text-align: center; }
  h1 { font-size: 1.2rem; margin: 0 0 4px; }
  .phase { color: var(--muted); margin: 0 0 20px; min-height: 1.5em; }
  .ring { position: relative; width: 240px; height: 240px; margin: 0 auto 20px; }
  .ring svg { width: 100%; height: 100%; transform: rotate(-90deg); }
  .ring circle { fill: none; stroke-width: 12; }
  .ring .track { stroke: var(--card); }
  .ring .fill { stroke: var(--focus); stroke-linecap: round; transition: stroke-dashoffset .5s linear, stroke .3s; }
  body.on-break .ring .fill { stroke: var(--break); }
  .time { position: absolute; inset: 0; display: grid; place-items: center;
          font-size: 3rem; font-weight: 600; font-variant-numeric: tabular-nums; }
  .message { min-height: 3em; margin: 0 0 16px; font-size: 1.1rem; }
  .message.done { color: var(--break); font-weight: 600; }
  .controls { display: flex; gap: 8px; justify-content: center; flex-wrap: wrap; }
  button { font: inherit; color: var(--fg); background: var(--card); border: 1px solid var(--border);
           border-radius: 8px; padding: 10px 18px; cursor: pointer; }
  button:hover { border-color: var(--focus); }
  button.primary { background: var(--focus); color: var(--bg); border-color: var(--focus); font-weight: 600; }
  body.on-break button.primary { background: var(--break); border-color: var(--break); }
  .sessions { color: var(--muted); font-size: .9rem; margin-top: 20px; }
  @media (prefers-reduced-motion: reduce) { .ring .fill { transition: none; } }
</style>
</head>
<body>
<main>
  <h1 id="title"></h1>
  <p class="phase" id="phase"></p>
  <div class="ring">
    <svg viewBox="0 0 240 240" aria-hidden="true">
      <circle class="track" cx="120" cy="120" r="108"></circle>
      <circle class="fill" id="fill" cx="120" cy="120" r="108"></circle>
    </svg>
    <div class="time" id="time" role="timer" aria-live="off"></div>
  </div>
  <p class="message" id="message" aria-live="polite"></p>
  <div class="controls">
    <button class="primary" id="start"></button>
    <button id="reset"></button>
  </div>
  <p class="sessions" id="sessions"></p>
</main>
<script>
/*
  Tilpass TIMER under:
  - minutes:      lengden på en fokusøkt (brukeren velger, f.eks. 15, 25 eller 45)
  - breakMinutes: lengden på pausen (standard 2)
  - topic:        hva brukeren jobber med, vises under tittelen
  - lang:         "no" eller "en"
  Fanen må være åpen for at lyden og meldingen skal komme.
*/
const TIMER = {
  minutes: 25,
  breakMinutes: 2,
  topic: "Normalfordeling",
  lang: "no",
};

const UI = {
  no: { title: "Fokustimer", focus: "Fokus", brk: "Pause", start: "Start", pause: "Pause",
        resume: "Fortsett", reset: "Nullstill", next: "Ny økt", ready: "Trykk start når du er klar.",
        focusing: "Fokuser på én ting. Mobilen kan vente.",
        done: (m) => `Godt jobbet – ${m} minutter fokus! Ta ${TIMER.breakMinutes} minutters pause: reis deg, strekk deg, drikk litt vann.`,
        breakOver: "Pausen er over. Klar for en ny økt?", sessions: (n) => `Fullførte økter: ${n}`,
        long: "Du har tatt fire økter. Kanskje tid for en lengre pause?" },
  en: { title: "Focus timer", focus: "Focus", brk: "Break", start: "Start", pause: "Pause",
        resume: "Resume", reset: "Reset", next: "New session", ready: "Press start when you're ready.",
        focusing: "Focus on one thing. Your phone can wait.",
        done: (m) => `Well done – ${m} minutes of focus! Take a ${TIMER.breakMinutes}-minute break: stand up, stretch, drink some water.`,
        breakOver: "Break's over. Ready for another session?", sessions: (n) => `Sessions completed: ${n}`,
        long: "That's four sessions. Maybe time for a longer break?" },
}[TIMER.lang] || {};

const $ = (id) => document.getElementById(id);
const C = 2 * Math.PI * 108;
$("fill").style.strokeDasharray = C;
document.documentElement.lang = TIMER.lang;
$("title").textContent = UI.title + (TIMER.topic ? ` · ${TIMER.topic}` : "");
$("reset").textContent = UI.reset;

// phase: "focus" | "break" | "idle-after-break"; endAt brukes så nedtellingen ikke driver.
const state = { phase: "focus", running: false, endAt: 0, left: TIMER.minutes * 60e3, sessions: 0, tick: null };

const total = () => (state.phase === "break" ? TIMER.breakMinutes : TIMER.minutes) * 60e3;
const fmt = (ms) => {
  const s = Math.max(0, Math.ceil(ms / 1000));
  return `${String(Math.floor(s / 60)).padStart(2, "0")}:${String(s % 60).padStart(2, "0")}`;
};

function draw() {
  const left = state.running ? state.endAt - Date.now() : state.left;
  $("time").textContent = fmt(left);
  $("fill").style.strokeDashoffset = C * (1 - Math.max(0, left) / total());
  $("phase").textContent = state.phase === "break" ? UI.brk : UI.focus;
  document.body.classList.toggle("on-break", state.phase === "break");
  $("start").textContent = state.phase === "idle-after-break" ? UI.next
    : state.running ? UI.pause : state.left < total() ? UI.resume : UI.start;
  $("sessions").textContent = state.sessions ? UI.sessions(state.sessions) : "";
  document.title = state.running ? `${fmt(left)} · ${state.phase === "break" ? UI.brk : UI.focus}` : UI.title;
  if (state.running && left <= 0) finish();
}

function beep(times = 2) {
  try {
    const ctx = new (window.AudioContext || window.webkitAudioContext)();
    for (let i = 0; i < times; i++) {
      const o = ctx.createOscillator(), g = ctx.createGain();
      o.frequency.value = 880;
      o.connect(g); g.connect(ctx.destination);
      const t = ctx.currentTime + i * 0.35;
      g.gain.setValueAtTime(0.0001, t);
      g.gain.exponentialRampToValueAtTime(0.3, t + 0.02);
      g.gain.exponentialRampToValueAtTime(0.0001, t + 0.3);
      o.start(t); o.stop(t + 0.32);
    }
  } catch (e) { /* lyd er ikke tilgjengelig; meldingen vises uansett */ }
}

function start() {
  if (state.phase === "idle-after-break") { state.phase = "focus"; state.left = total(); }
  state.running = true;
  state.endAt = Date.now() + state.left;
  $("message").className = "message";
  $("message").textContent = state.phase === "focus" ? UI.focusing : $("message").textContent;
  clearInterval(state.tick);
  state.tick = setInterval(draw, 250);
  draw();
}
function pause() {
  state.left = Math.max(0, state.endAt - Date.now());
  state.running = false;
  clearInterval(state.tick);
  draw();
}
function finish() {
  clearInterval(state.tick);
  state.running = false;
  beep(state.phase === "focus" ? 3 : 2);
  if (state.phase === "focus") {
    state.sessions++;
    $("message").className = "message done";
    $("message").textContent = UI.done(TIMER.minutes) + (state.sessions % 4 === 0 ? " " + UI.long : "");
    state.phase = "break";
    state.left = total();
    start(); // pausen starter av seg selv
    $("message").className = "message done";
  } else {
    state.phase = "idle-after-break";
    state.left = 0;
    $("message").className = "message";
    $("message").textContent = UI.breakOver;
    draw();
  }
}

$("start").onclick = () => (state.running ? pause() : start());
$("reset").onclick = () => {
  clearInterval(state.tick);
  Object.assign(state, { phase: "focus", running: false, left: TIMER.minutes * 60e3 });
  $("message").className = "message";
  $("message").textContent = UI.ready;
  draw();
};
document.addEventListener("keydown", (e) => {
  if (e.key === " " && e.target === document.body) { e.preventDefault(); $("start").click(); }
});

$("message").textContent = UI.ready;
draw();
</script>
</body>
</html>
